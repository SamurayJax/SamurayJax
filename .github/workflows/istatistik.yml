name: Profil istatistikleri

on:
  schedule:
    - cron: "41 2 * * *"   # her gün 02:41 UTC (05:41 Türkiye)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["araclar/**", ".github/workflows/istatistik.yml"]

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kartları üret
        env:
          # Gizli depolar da sayılsın diye PROFIL_TOKEN (kişisel erişim jetonu) varsa o, yoksa yalnız herkese açık veri.
          GH_TOKEN: ${{ secrets.PROFIL_TOKEN || github.token }}
          GH_KULLANICI: ${{ github.repository_owner }}
        run: |
          node araclar/kartlar.mjs
          node araclar/istatistik.mjs
      - name: Değiştiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "İstatistikler güncellendi" && git push)
